  box-shadow: 0 6px 18px rgba(0,0,0,.28);
  font-weight: 800;
  font-size: 12px;
}

.pin span {
  transform: rotate(45deg);
}

.pin--on {
  background: #111111;
  color: #FFFFFF;
  transform: rotate(-45deg) scale(1.15);
}

.map-selected {
  border-color: #C9A24B !important;
  background: #F7F2EB !important;
}

/* ---- Menu flutuante ---- */

.site-header {
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid #C9A24B;
  box-shadow: 0 6px 24px rgba(17,17,17,.06);
  transition: box-shadow .35s ease, background .35s ease;
}

.site-header.is-scrolled {
  background: rgba(255,255,255,.96);
  box-shadow: 0 14px 36px rgba(17,17,17,.12);
}

.header-logo {
  background: transparent !important;
  background-color: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  width: 130px;
  max-width: 100%;
  height: auto;
  mix-blend-mode: normal;
  filter: none;
}

@media (min-width: 640px) {
  .header-logo {
    width: 150px;
  }
}

.footer-logo {
  background: transparent !important;
  background-color: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  width: 200px;
  max-width: 100%;
  height: auto;
  mix-blend-mode: normal;
  filter: none;
}

.nav-link {
  position: relative;
  padding: 6px 2px;
  color: #111111;
  font-weight: 600;
}

.nav-link::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: 0;
  height: 2px;
  background: #C9A24B;
  transition: right .25s ease;
}

.nav-link:hover::after, .nav-link:focus-visible::after {
  right: 0;
}

.nav-cta {
  transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
  box-shadow: 0 8px 20px rgba(201,162,75,.35);
}

.nav-cta:hover {
  transform: translateY(-1px);
  box-shadow: 0 12px 26px rgba(201,162,75,.45);
  background: #E8C97A;
}

a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid #C9A24B;
  outline-offset: 3px;
  border-radius: 6px;
}

button, a, summary, input[type="checkbox"], input[type="range"] {
  min-height: 44px;
}

a.btn-gold, a.btn-outline, a.nav-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes slideInRight {
  from {
    transform: translateX(100%);
  }

  to {
    transform: translateX(0);
  }
}

.animate-enter {
  animation: fadeUp .7s ease both;
}

.animate-enter-2 {
  animation: fadeUp .7s .12s ease both;
}

.animate-enter-3 {
  animation: fadeUp .7s .24s ease both;
}

.drawer-overlay {
  animation: fadeIn .25s ease both;
}

.drawer-panel {
  animation: slideInRight .32s cubic-bezier(.2,.8,.2,1) both;
}

.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: #111111;
  border-radius: 2px;
  transition: transform .3s ease, opacity .3s ease;
}

.hamburger span + span {
  margin-top: 5px;
}

.hamburger.is-open span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.hamburger.is-open span:nth-child(2) {
  opacity: 0;
}

.hamburger.is-open span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

.footer-gold-line {
  height: 2px;
  background: #C9A24B;
}

.contact-card {
  transition: transform .25s ease, box-shadow .25s ease;
}

.contact-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 38px rgba(17,17,17,.09);
}

details.faq-item {
  display: block;
  overflow-wrap: anywhere;
}

details.faq-item > p {
  overflow-wrap: anywhere;
}

details.faq-item > summary {
  list-style: none;
  cursor: pointer;
  display: block;
  position: relative;
  padding-right: 3rem;
}

details.faq-item > summary::-webkit-details-marker {
  display: none;
}

details.faq-item > summary::after {
  content: "▾";
  position: absolute;
  right: 1.25rem;
  top: 50%;
  transform: translateY(-50%);
}

details.faq-item[open] > summary::after {
  transform: translateY(-50%) rotate(180deg);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;

<script>
(function(){
  var MAP_VIDEO={'media-1':'video1.mp4','media-2':'video2.mp4'};
  // MAP_INSTA removido: videos sem link do Instagram
  var MAP_TITULO={'media-1':'Por tras de cada atendimento','media-2':'POV: voce escolheu a tecnica certa'};
  function fixVideos(){
    document.querySelectorAll('[data-clippy-inline-media-slot]').forEach(function(el){
      if(el.dataset.fixed) return;
      var slot=el.getAttribute('data-clippy-inline-media-slot');
      var src=MAP_VIDEO[slot]||'video1.mp4';
      // Sem link do Instagram nos videos
      var titulo=MAP_TITULO[slot]||'Studio Keli Valadares';
      el.dataset.fixed='1';
      while(el.firstChild) el.removeChild(el.firstChild);
      el.style.cssText='display:block;background:#111;border-radius:12px;overflow:hidden;width:100%';
      var poster = src.replace('.mp4','-poster.jpg');
      var wrap=document.createElement('div');
      wrap.style.cssText='position:relative;display:block;width:100%;aspect-ratio:9/16;background:#111;min-height:520px;cursor:pointer;overflow:hidden;border-radius:12px';
      wrap.setAttribute('role','button'); wrap.setAttribute('tabindex','0'); wrap.setAttribute('aria-label','Tocar video: '+titulo);
      var img=document.createElement('img');
      img.src=poster; img.alt=titulo; img.loading='lazy'; img.decoding='async';
      img.style.cssText='display:block;width:100%;height:100%;object-fit:cover;position:absolute;inset:0';
      img.onerror=function(){ this.style.display='none'; wrap.style.background='linear-gradient(135deg,#111 0%,#3a2a12 50%,#C9A24B 100%)'; };
      var playBtn=document.createElement('span');
      playBtn.innerHTML='▶';
      playBtn.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:#C9A24B;color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-size:28px;padding-left:4px;box-shadow:0 10px 30px rgba(0,0,0,.45)';
      var dur=document.createElement('span'); dur.textContent='Toque para assistir'; dur.style.cssText='position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap';
      wrap.appendChild(img); wrap.appendChild(playBtn); wrap.appendChild(dur);
      var v=null;
      function playVideo(){
        if(v) return;
        v=document.createElement('video');
        v.src=src; v.controls=true; v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto'; v.autoplay=true; v.setAttribute('aria-label',titulo);
        v.style.cssText='display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#111;min-height:520px;position:relative;z-index:2';
        wrap.innerHTML=''; wrap.appendChild(v); wrap.style.cursor='default';
        v.addEventListener('error', function(){
          var err=document.createElement('div');
          err.style.cssText='position:absolute;inset:0;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:3';
          err.innerHTML='<div style="font-size:15px;font-weight:700;margin-bottom:8px">Vídeo não encontrado</div><div style="font-size:13px;line-height:1.5;color:#ddd">Verifique se o arquivo <b>'+src+'</b> está na raiz do repositório no GitHub, sem .mp4.mp4.<br><a href="'+src+'" target="_blank" rel="noopener" style="color:#C9A24B;text-decoration:underline">Toque aqui para testar o arquivo direto</a></div>';
          wrap.appendChild(err);
        });
        v.play().catch(function(){ if(v) v.controls=true; });
      }
      wrap.addEventListener('click', playVideo);
      wrap.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); playVideo(); } });
      var cap=document.createElement('div');
      cap.style.cssText='padding:12px 14px;background:#fff;color:#111;font-size:14px;line-height:1.5';
      var b=document.createElement('div'); b.textContent=titulo; b.style.cssText='font-weight:700;font-size:15px';
      // Sem link nos videos
      // Sem handle do Instagram nos videos
      cap.appendChild(b);
      el.appendChild(wrap); el.appendChild(cap);
    });
  }
  fixVideos();
  var tries=setInterval(fixVideos,500);
  setTimeout(function(){clearInterval(tries)},12000);
  try{new MutationObserver(fixVideos).observe(document.body,{childList:true,subtree:true});}catch(e){}
})();
</script>

<script>
(function(){
  var INSTA='https://www.instagram.com/studiokelivaladares/';
  function linkAtMentions(){
    // encontra qualquer texto @studiokelivaladares que ainda não está dentro de <a> e transforma em link
    var walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var nodes=[];
    while(walker.nextNode()){
      var n=walker.currentNode;
      if(n.nodeValue && n.nodeValue.indexOf('@studiokelivaladares')>-1 && n.parentElement && n.parentElement.tagName!=='A' && n.parentElement.tagName!=='SCRIPT' && n.parentElement.tagName!=='STYLE'){
        nodes.push(n);
      }
    }
    nodes.forEach(function(n){
      var parent=n.parentElement;
      if(!parent || parent.closest('a')) return;
      var parts=n.nodeValue.split('@studiokelivaladares');
      var frag=document.createDocumentFragment();
      frag.appendChild(document.createTextNode(parts[0]));
      var a=document.createElement('a');
      a.href=INSTA; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent='@studiokelivaladares';
      a.style.cssText='color:inherit;text-decoration:underline;text-underline-offset:4px;font-weight:700';
      frag.appendChild(a);
      frag.appendChild(document.createTextNode(parts.slice(1).join('@studiokelivaladares')));
      parent.replaceChild(frag, n);
    });
  }
  function run(){ linkAtMentions(); }
  run();
  var t=setInterval(run, 800);
  setTimeout(function(){clearInterval(t)}, 10000);
  try{ new MutationObserver(run).observe(document.body,{childList:true,subtree:true}); }catch(e){}
})();
</script>

<script>
/* GitHub - trava: clique interno fica no site, só WhatsApp/Instagram/Maps/Waze saem */
document.addEventListener('click', function(e){
  var a = e.target.closest('a');
  if(!a) return;
  var href = a.getAttribute('href') || '';
  // Interno (#...) fica na mesma aba, nunca abre nova aba
  if(href.charAt(0) === '#'){
    a.removeAttribute('target');
    return;
  }
  // Externo permitido só nesses 3 casos, sempre com noopener
  var isWhats = href.indexOf('wa.me') > -1;
  var isInsta = href.indexOf('instagram.com') > -1;
  var isMaps = href.indexOf('google.com/maps') > -1 || href.indexOf('waze.com') > -1 || href.indexOf('maps.app.goo.gl') > -1;
  if(isWhats || isInsta || isMaps){
    a.setAttribute('target','_blank');
    a.setAttribute('rel','noopener noreferrer');
  }
}, true);
</script>

<!-- VIDEO CORRIGIDO v6: não esconde o video, botão dourado por cima, controle nativo sempre funciona -->
<style>
.video-v6-wrap{position:relative;display:block;width:100%;aspect-ratio:9/16;background:#111;overflow:hidden;border-radius:12px}
.video-v6-wrap video{display:block!important;width:100%!important;height:100%!important;min-height:480px!important;object-fit:cover!important;background:#111}
.video-v6-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#C9A24B;color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-size:30px;padding-left:4px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5;cursor:pointer;border:none}
.video-v6-play:active{transform:translate(-50%,-50%) scale(.96)}
.video-v6-label{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;z-index:5;pointer-events:none}
.video-v6-erro{display:none;margin-top:10px;background:#FFF3CD;color:#111;border:1px solid #C9A24B;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5}
.video-v6-erro a{color:#111;font-weight:700;text-decoration:underline}
</style>
<script>
(function(){
  function corrigirVideos(){
    document.querySelectorAll('video').forEach(function(video){
      if(video.dataset.v6) return;
      video.dataset.v6='1';
      // Garantir atributos que fazem tocar no celular
      video.setAttribute('playsinline','');
      video.setAttribute('webkit-playsinline','');
      video.setAttribute('preload','metadata');
      video.controls = true;
      // Envolver sem esconder o video
      var parent = video.parentNode;
      if(!parent) return;
      // Se já está dentro de um wrap v6, pular
      if(parent.className && parent.className.indexOf('video-v6-wrap')>-1) return;
      var wrap = document.createElement('div');
      wrap.className = 'video-v6-wrap';
      parent.insertBefore(wrap, video);
      wrap.appendChild(video);
      // Botão dourado por cima do poster
      var btn = document.createElement('button');
      btn.type='button'; btn.className='video-v6-play'; btn.textContent='▶';
      btn.setAttribute('aria-label','Tocar vídeo');
      var label = document.createElement('span');
      label.className='video-v6-label'; label.textContent='Toque para assistir';
      wrap.appendChild(btn); wrap.appendChild(label);
      // Caixa de erro (só aparece se o arquivo não existir)
      var erro = document.createElement('div');
      erro.className='video-v6-erro';
      erro.innerHTML = 'Vídeo não carregou. Verifique se o arquivo <b>'+ (video.getAttribute('src')||'video1.mp4') +'</b> está na raiz do repositório no GitHub, sem .mp4.mp4. <a href="'+ (video.getAttribute('src')||'video1.mp4') +'" target="_blank" rel="noopener">Toque aqui para testar o arquivo direto</a>. Se abrir o vídeo direto, é só recarregar a página.';
      // Colocar erro logo depois do wrap
      if(wrap.parentNode) wrap.parentNode.insertBefore(erro, wrap.nextSibling);
      function tocar(){
        btn.style.display='none'; label.style.display='none';
        video.style.display='block';
        // Forçar carregar e tocar
        try{ video.load(); }catch(e){}
        var p = video.play();
        if(p && p.catch) p.catch(function(){ video.controls=true; });
      }
      btn.addEventListener('click', tocar);
      wrap.addEventListener('click', function(e){
        if(e.target===btn) return;
        // Se clicou na área do vídeo e o vídeo está pausado, tocar também
        if(video.paused) tocar();
      });
      // Se o usuário tocar no controle nativo, esconder o botão dourado
      video.addEventListener('play', function(){ btn.style.display='none'; label.style.display='none'; });
      video.addEventListener('pause', function(){ if(video.currentTime===0){ btn.style.display='flex'; label.style.display='block'; } });
      // Erro 404 ou codec: mostrar aviso em vez de tela preta
      video.addEventListener('error', function(){
        erro.style.display='block';
        btn.style.display='none'; label.style.display='none';
      }, true);
      // Checar se arquivo existe (HEAD) - se 404, mostrar aviso já
      try{
        var src = video.getAttribute('src');
        if(src && src.indexOf('.mp4')>-1){
          fetch(src, {method:'HEAD'}).then(function(r){
            if(!r.ok){ erro.style.display='block'; }
          }).catch(function(){});
        }
      }catch(e){}
    });
  }
  corrigirVideos();
  setTimeout(corrigirVideos, 500);
  setTimeout(corrigirVideos, 1500);
  setTimeout(corrigirVideos, 3000);
  try{ new MutationObserver(corrigirVideos).observe(document.body,{childList:true,subtree:true}); }catch(e){}
  // Diagnóstico no console para você ver no F12
  window.addEventListener('load', function(){
    setTimeout(function(){
      document.querySelectorAll('video').forEach(function(v,i){
        console.log('[KELI v6 VIDEO]', i, 'src=', v.getAttribute('src'), 'poster=', v.getAttribute('poster'), 'controls=', v.controls);
      });
    }, 1500);
  });
})();
</script>
